# Publica la app en GitHub Pages, después de pasar las pruebas.
#
# `enablement: true` en configure-pages hace que el propio flujo active Pages y lo
# ponga en modo "GitHub Actions". Es lo que evita tener que tocar
# Settings -> Pages a mano, que es justo donde uno se atasca desde el móvil (la
# app de GitHub no tiene esa pantalla). También es el remedio que sugiere el
# error "Get Pages site failed" cuando Pages no está configurado para Actions.
#
# Las pruebas van delante del despliegue a propósito: es mejor una app vieja que
# funciona que una nueva con el planificador roto.

name: Publicar en GitHub Pages

on:
  push:
    branches:
      - main
      - claude/crianza-pokemmo-structure-vt8lto
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez, y sin cancelar el que ya esté en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  probar:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # El proyecto no tiene dependencias: no hay nada que instalar.
      - name: Pruebas unitarias
        run: node pruebas/ejecutar.mjs
      - name: Comprobar que los datos siguen cuadrando con la wiki
        run: node herramientas/comprobar-datos.mjs

  publicar:
    name: Publicar
    needs: probar
    # Sólo se publica desde la rama principal. Un push a una rama de trabajo corre
    # las pruebas pero no toca el sitio publicado, y así tampoco choca con la
    # regla del entorno github-pages, que suele aceptar sólo la rama por defecto.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # La app es estática y vive en la raíz: se sube tal cual, sin compilar.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: desplegar
        uses: actions/deploy-pages@v4
