# Publica la app en GitHub Pages, después de pasar las pruebas.
#
# HAY UN PASO MANUAL, UNA SOLA VEZ:
#   Settings -> Pages -> Build and deployment -> Source = "GitHub Actions"
#
# No se puede automatizar, y conviene saber por qué: el GITHUB_TOKEN del flujo
# tiene `pages: write`, que permite DESPLEGAR en un sitio de Pages que ya exista
# y cambiarle el modo de construcción, pero **no crearlo** — crear el sitio
# necesita permisos de administración del repositorio, que el token no tiene.
# Por eso `enablement: true` falla con "Create Pages site failed: Resource not
# accessible by integration" cuando no hay sitio previo. Se deja puesto porque
# sí sirve para pasar un sitio existente al modo Actions.
#
# Ojo también: si el repositorio pasa a **privado** con plan gratuito, GitHub
# despublica el sitio y hay que repetir el paso manual al volverlo público.
#
# Las pruebas van delante del despliegue a propósito: es mejor una app vieja que
# funciona que una nueva con el planificador roto.

name: Publicar en GitHub Pages

on:
  push:
    branches:
      - main
      - claude/crianza-pokemmo-structure-vt8lto
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez, y sin cancelar el que ya esté en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  probar:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # El proyecto no tiene dependencias: no hay nada que instalar.
      - name: Pruebas unitarias
        run: node pruebas/ejecutar.mjs
      - name: Comprobar que los datos siguen cuadrando con la wiki
        run: node herramientas/comprobar-datos.mjs

  publicar:
    name: Publicar
    needs: probar
    # Sólo se publica desde la rama principal. Un push a una rama de trabajo corre
    # las pruebas pero no toca el sitio publicado, y así tampoco choca con la
    # regla del entorno github-pages, que suele aceptar sólo la rama por defecto.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: configurar
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Si lo de arriba falla es casi siempre por lo mismo, y el error de GitHub
      # no lo dice. Mejor dejarlo escrito aquí que volver a investigarlo.
      - name: Explicar el fallo si Pages no está configurado
        if: failure() && steps.configurar.outcome == 'failure'
        run: |
          echo "::error title=Falta activar Pages::Pages no está configurado en este repositorio."
          echo ""
          echo "El flujo puede desplegar, pero no puede CREAR el sitio: eso necesita"
          echo "permisos de administración que el GITHUB_TOKEN no tiene."
          echo ""
          echo "Arréglalo una sola vez, desde el navegador (la app de GitHub no"
          echo "tiene esta pantalla):"
          echo "  https://github.com/${{ github.repository }}/settings/pages"
          echo "  Build and deployment -> Source = GitHub Actions"
          echo ""
          echo "Y comprueba que el repositorio sea PÚBLICO: con plan gratuito,"
          echo "Pages no funciona en repositorios privados."
          exit 1
      # La app es estática y vive en la raíz: se sube tal cual, sin compilar.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: desplegar
        uses: actions/deploy-pages@v4
