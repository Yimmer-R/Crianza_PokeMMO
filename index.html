<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crianza PokeMMO</title>
<meta name="description" content="Planificador de crianza y entrenamiento para PokeMMO: del inventario al Pokémon objetivo, paso a paso.">

<!-- Móvil: barra del navegador a tono, y se puede añadir a la pantalla de inicio
     como si fuera una app. Nada de esto hace falta para que funcione. -->
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crianza">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="iconos/icono-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23d90429'/%3E%3Cpath d='M2 16h28' stroke='%23050505' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23050505'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="src/css/estilos.css">
</head>
<body>
<header class="cabecera">
  <h1>Crianza <span class="tenue">PokeMMO</span></h1>
  <p class="lema">Dime el Pokémon que quieres y te digo cómo llegar desde lo que ya tienes.</p>
  <!-- El cuadro con borde de la plantilla, donde ponía «EDITION 2022»: aquí
       dice de cuándo son los datos, que es lo que de verdad caduca. -->
  <div class="edicion">Datos de<b id="edicion-fecha">—</b></div>
</header>

<div id="crianzas" class="crianzas-hueco" aria-label="Crianzas en marcha"></div>

<nav class="pestanas" id="pestanas" aria-label="Secciones">
  <button type="button" data-vista="objetivo" class="activa">Objetivo</button>
  <button type="button" data-vista="plan">Plan</button>
  <button type="button" data-vista="inventario">Inventario</button>
  <button type="button" data-vista="capturas">Capturas</button>
  <button type="button" data-vista="entrenamiento">Entrenamiento</button>
</nav>

<main id="vista" class="vista">
  <p class="cargando">Cargando…</p>
</main>

<footer class="pie">
  <p><span id="pie-meta"></span></p>
  <p class="tenue">Mecánicas de 5ª generación: ni tipo Hada ni Megaevoluciones.</p>
</footer>

<script type="module" src="src/ui/app.js"></script>
</body>
</html>
